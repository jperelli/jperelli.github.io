---
layout: page
title: Projects
---

<div class="card-grid">
  {% for post in site.categories.project %}
    <a class="card" href="{{ post.url }}">
      <span class="card-year">{{ post.date | date: '%Y' }}</span>
      <span class="card-title">{{ post.title }}</span>
      {% if post.description %}
        <p class="card-desc">{{ post.description }}</p>
      {% endif %}
    </a>
  {% endfor %}
</div>
