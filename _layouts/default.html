<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en-us">

  {% include head.html %}
  {% include google_analytics.html %}

  <body>

    <header class="site-header">
      <div class="container">
        <a class="site-name" href="/" title="Home">{{ site.title }}</a>
        <nav class="site-nav">
          {% for page in site.pages_list %}
            <a href="{{ page[1] }}">{{ page[0] }}</a>
          {% endfor %}
          <button class="theme-toggle" type="button" aria-label="Toggle dark mode" onclick="toggleTheme()">
            <span class="icon-moon">🌙</span><span class="icon-sun">☀️</span>
          </button>
        </nav>
      </div>
    </header>

    <main class="content">
      <div class="container">
        {{ content }}

        {% include comments.html %}
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <span>© {{ site.time | date: '%Y' }} {{ site.author.name }}</span>
        <span class="footer-links">
          <a href="https://github.com/jperelli">GitHub</a>
          <a href="https://www.linkedin.com/in/jperelli/">LinkedIn</a>
          <a href="https://stackoverflow.com/users/912450/jperelli">Stack Overflow</a>
          <a href="/atom.xml">RSS</a>
        </span>
      </div>
    </footer>

    <script>
      function toggleTheme() {
        var root = document.documentElement;
        var dark = root.getAttribute('data-theme') === 'dark';
        if (dark) {
          root.removeAttribute('data-theme');
          localStorage.setItem('theme', 'light');
        } else {
          root.setAttribute('data-theme', 'dark');
          localStorage.setItem('theme', 'dark');
        }
      }
    </script>

  </body>
</html>
